<div class="mobile-cta" aria-label="Contact rapide" role="region">
  <a href="/devis-en-ligne" class="mobile-cta__main" data-track="cta_sticky_devis">Voir mon prix en 30 s</a>
  <a href="https://wa.me/{{phoneIntl}}?text={{waDefault}}" class="mobile-cta__icon mobile-cta__icon--wa" target="_blank" rel="noopener" data-track="cta_sticky_whatsapp">
    <fr-icon name="whatsapp" size="22"></fr-icon><span class="sr-only">Écrire sur WhatsApp</span>
  </a>
  <a href="tel:{{phoneTel}}" class="mobile-cta__icon" data-track="cta_sticky_tel">
    <fr-icon name="phone" size="20"></fr-icon><span class="sr-only">Appeler le {{phone}}</span>
  </a>
</div>

<button class="back-to-top" type="button" data-back-to-top hidden>
  <fr-icon name="arrow-up" size="20"></fr-icon><span class="sr-only">Revenir en haut de page</span>
</button>
