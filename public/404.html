<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">
  <title>Page introuvable — Finition Royale</title>
  <style>
    :root {
      --or: #C9A84C; --noir: #080808; --blanc: #F5F0E8; --gris: #6a6460;
      --font-display: 'Bebas Neue', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--noir);
      color: var(--blanc);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .num {
      font-family: var(--font-display);
      font-size: clamp(8rem, 25vw, 16rem);
      color: rgba(201,168,76,0.08);
      line-height: 0.85;
      letter-spacing: 0.04em;
      user-select: none;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 4rem);
      color: var(--blanc);
      margin: 1rem 0 0.5rem;
      letter-spacing: 0.04em;
    }
    h1 em {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      color: var(--or);
    }
    p { font-size: 0.95rem; color: var(--gris); margin-bottom: 2.5rem; line-height: 1.7; max-width: 420px; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.9rem 1.8rem; border-radius: 3px;
      text-decoration: none; transition: all 0.25s ease;
    }
    .primary {
      background: linear-gradient(135deg, var(--or), #E8C97A);
      color: var(--noir);
    }
    .primary:hover { opacity: 0.85; transform: translateY(-2px); }
    .ghost {
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--or);
    }
    .ghost:hover { border-color: var(--or); background: rgba(201,168,76,0.08); }
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>Page <em>introuvable</em></h1>
  <p>Cette page n'existe pas ou a été déplacée. Revenez à l'accueil pour trouver ce que vous cherchez.</p>
  <div class="actions">
    <a href="/" class="btn primary">← Retour à l'accueil</a>
    <a href="/#rdv" class="btn ghost">Prendre RDV</a>
  </div>
</body>
</html>
