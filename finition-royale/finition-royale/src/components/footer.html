<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="/assets/logo.png" alt="{{brand}}" width="50" height="50">
        <p>{{tagline}}<br>{{city}} &amp; alentours.</p>
      </div>
      <div class="footer-links">
        <h4>Navigation</h4>
        <ul>
          <li><a href="/">Accueil</a></li>
          <li><a href="/prestations">Prestations</a></li>
          <li><a href="/avant-apres">Avant / Après</a></li>
          <li><a href="/faq">FAQ</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </div>
      <div class="footer-contact">
        <h4>Contact rapide</h4>
        <a href="https://wa.me/{{phoneIntl}}?text={{waDefault}}" target="_blank" rel="noopener" data-track="cta_footer_whatsapp">💬 WhatsApp</a>
        <a href="sms:+{{phoneIntl}}?body={{smsDefault}}" data-track="cta_footer_sms">📱 SMS</a>
        <p class="footer-hours">{{hours}}</p>
        <p class="footer-zone">Zones : {{zones}}</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© {{year}} {{brand}} · Detailing auto à domicile à {{city}} · <a href="/mentions-legales">Mentions légales</a></p>
    </div>
  </div>
</footer>
