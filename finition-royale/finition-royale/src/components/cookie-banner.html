    <div class="cookie-text">
      <strong>Vos préférences en matière de cookies.</strong>
      <p>Nous utilisons des cookies de mesure d'audience (Google Analytics, IP anonymisée) pour comprendre l'usage du site. Aucun cookie publicitaire n'est déposé. <a href="/politique-confidentialite">En savoir plus</a>.</p>

  </div>
</div>
