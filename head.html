<!--
  templates/head.html
  Copier ce bloc dans chaque page. Remplacer les variables {{...}}.

  Variables :
    {{TITLE}}       — Titre de la page (ex: "Finition Royale : Detailing Besançon")
    {{DESCRIPTION}} — Meta description (155 chars max)
    {{CANONICAL}}   — URL canonique complète
    {{OG_TITLE}}    — Titre OpenGraph (souvent = TITLE)
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">

<!-- OpenGraph -->
<meta property="og:title"       content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url"         content="{{CANONICAL}}">
<meta property="og:type"        content="website">
<meta property="og:locale"      content="fr_FR">
<meta property="og:site_name"   content="Finition Royale">
<meta property="og:image"       content="https://www.finitionroyale.fr/assets/img/og-finition-royale.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image"       content="https://www.finitionroyale.fr/assets/img/og-finition-royale.jpg">

<!-- Favicons -->
<link rel="icon"             type="image/x-icon" href="/favicon.ico">
<link rel="icon"             type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon"             type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Fonts — preconnect first, then load -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">

<!-- CSS — load order matters -->
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">

<title>{{TITLE}}</title>
